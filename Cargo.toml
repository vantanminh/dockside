[workspace]
resolver = "3"
members = [
    "crates/dockside-core",
    "crates/dockside-server",
    "crates/dockside-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vantanminh/dockside"
homepage = "https://github.com/vantanminh/dockside"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "macros"] }
blake3 = "1.8"
bytes = "1.12"
clap = { version = "4.5", features = ["derive", "env"] }
diffy = "0.4"
globset = "0.4"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6"
tempfile = "3"
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs", "io-util", "sync", "process"] }
toml = "0.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
walkdir = "2.5"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 2
strip = true
panic = "abort"
